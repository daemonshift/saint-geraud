name: CI

on:
  push:
    branches: [main, 'spec/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyse gitleaks de tout l'historique
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  site:
    name: Tests, build et accessibilité
    runs-on: ubuntu-latest
    # Aucun accès à Airtable depuis GitHub : le build utilise les données d'exemple.
    env:
      AIRTABLE_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Types et couleurs hors tokens
        run: npm run check

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build (données d'exemple)
        run: npm run build

      - name: Domaines tiers chargés (liste blanche)
        run: npm run check:domaines

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Site construit (Playwright + axe, WCAG 2.1 A/AA)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
